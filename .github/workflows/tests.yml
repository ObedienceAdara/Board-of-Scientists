name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic test pyramid
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: pytest -q
