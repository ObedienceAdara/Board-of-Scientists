name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run deterministic test pyramid
        env:
          APP_ENV: test
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: pytest -q
